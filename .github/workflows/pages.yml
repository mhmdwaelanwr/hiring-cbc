name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Stamp static asset versions
        shell: bash
        run: |
          VERSION="${GITHUB_SHA::12}"
          sed -i -E "s#(assets/(css|js)/[^?\"']+)\?v=[^\"']+#\1?v=${VERSION}#g" index.html
          sed -i -E "s#\?v=[A-Za-z0-9._-]+#?v=${VERSION}#g" assets/css/site.css

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
